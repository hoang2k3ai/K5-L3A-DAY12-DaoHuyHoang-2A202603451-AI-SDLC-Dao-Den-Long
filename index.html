<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đảo Đèn Lồng — Đêm 1</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <div class="hud-top">
        <div class="panel">
          <span class="label">Ánh sáng</span>
          <div id="flames" class="pips"></div>
        </div>
        <div class="panel"><span class="label">Đom đóm</span><span id="carried" class="value">0/5</span></div>
        <div class="panel"><span class="label">Đèn lồng</span><span id="lanterns" class="value">0/5</span></div>
        <div class="panel"><span class="label">Điểm</span><span id="score" class="value">0</span></div>
        <div class="panel"><span class="label">Còn lại</span><span id="timer" class="value">05:00</span></div>
      </div>
      <div class="hud-bottom">
        <div class="hint">WASD di chuyển · Space nhảy · E nạp đèn · Q tỏa sáng · R chơi lại · kéo chuột để xoay camera</div>
        <div class="objective" id="objective">Thắp lại 5 Đèn Lồng Lớn trước khi sương đen nuốt mất đảo.</div>
      </div>
    </div>

    <div id="flash"></div>

    <div id="overlay" class="hidden">
      <div class="card">
        <h1 id="overlay-title">Đêm đã sáng</h1>
        <p id="overlay-text"></p>
        <button id="restart" type="button">Chơi lại (R)</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
